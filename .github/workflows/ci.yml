name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck (CLI)
        run: npm run typecheck

      - name: Typecheck (gateway worker)
        run: npx tsc -p worker/tsconfig.json --noEmit

      - name: Test
        run: npm test
