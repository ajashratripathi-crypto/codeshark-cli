# CodeShark community gateway — the zero-setup path for end users.
# Runs on Cloudflare's FREE plan (100k requests/day). No billing.
#
# Deploy your own:
#   1. npx wrangler secret put UNOROUTER_API_KEY    # free UnoRouter key (primary)
#   2. npx wrangler secret put OPENROUTER_API_KEY   # free OpenRouter key (fallback, optional)
#   3. npx wrangler deploy
#
# The gateway fails over between providers on 429/errors, waits through
# rate limits, and queues per-IP bursts instead of dropping them.
name = "codeshark-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
# Optional: require a shared token from clients (CODESHARK_GATEWAY_KEY on the client side)
# GATEWAY_SHARED_SECRET = "change-me"